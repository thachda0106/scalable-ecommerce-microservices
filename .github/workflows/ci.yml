name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages & services
        run: pnpm -r build

      - name: Type check all services
        run: |
          for dir in apps/*/; do
            echo "🔍 Type checking $dir"
            (cd "$dir" && npx tsc --noEmit) || exit 1
          done

      - name: Run tests
        run: pnpm -r test --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
